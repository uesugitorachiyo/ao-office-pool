name: verify

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/scan_public_tree.py .
      - run: python -m unittest tests.test_verify_components tests.test_verify_requirements -v
      - run: python -m unittest discover -s tests -v
